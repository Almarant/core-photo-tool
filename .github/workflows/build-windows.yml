name: Build Windows app

# Builds CorePhotoTool.exe on GitHub's Windows runners, so nobody needs Python
# installed to use it.
#
#   - push to main  -> .exe under the run's "Artifacts"
#   - push a tag    -> .exe attached to a Release:  git tag v1.0.0 && git push --tags

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write     # needed for the release step to attach the .exe

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Sanity check (imports and pure logic, no GUI)
        run: python -m tests.test_logic

      # No Tesseract step. Label reading is done by corephoto/glyphs.py,
      # trained on the project's own stencil tiles: better on this material
      # (93% vs 38% correct) and ~50 MB smaller than bundling an OCR engine.

      - name: Build executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --onefile --windowed `
            --name CorePhotoTool `
            --icon corephoto/icon.ico `
            --add-data "corephoto/icon.ico;corephoto" `
            --add-data "corephoto/icon.png;corephoto" `
            --add-data "corephoto/glyph_templates.npz;corephoto" `
            --collect-submodules corephoto `
            --collect-data sv_ttk `
            --collect-all tkinterdnd2 `
            --hidden-import PIL._tkinter_finder `
            run_app.py

      - name: Smoke test the frozen exe
        shell: pwsh
        run: |
          # The app is windowed, so just confirm it starts and stays up briefly.
          $p = Start-Process -FilePath dist\CorePhotoTool.exe -PassThru
          Start-Sleep -Seconds 25
          if ($p.HasExited) {
            throw "CorePhotoTool.exe exited immediately (code $($p.ExitCode))"
          }
          Stop-Process -Id $p.Id -Force
          Write-Host "Frozen exe launched and stayed running."

      - name: Package
        run: |
          mkdir dist_pkg
          copy dist\CorePhotoTool.exe dist_pkg\
          copy PHOTO_SOP.md dist_pkg\
          copy README.md dist_pkg\

      - uses: actions/upload-artifact@v4
        with:
          name: CorePhotoTool-windows
          path: dist_pkg/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist_pkg/*
          generate_release_notes: true
